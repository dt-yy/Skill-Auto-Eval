[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skill-auto-eval"
version = "0.1.0"
description = "Unified availability, effectiveness, and security evaluation for Agent Skills"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
skill-eval = "skill_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_eval"]
